# This file is the source of truth: events missing here are removed from the table on sync.
#
# Sources (fetched 2026-10-29; Rob double-checks against the pages):
#   FOMC: https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm ("Last Update: October 28,
#     2026"). `date` is the second meeting day, when the statement is released at 2:00 pm ET.
#     2027 dates are tentative until confirmed at the preceding meeting. "(with SEP)" marks the
#     meetings with a Summary of Economic Projections.
#   CPI: https://www.bls.gov/schedule/news_release/cpi.htm, released at 8:30 am ET. BLS blocks
#     scripts (HTTP 403); 2026 dates were cross-checked with FRED's release calendar (release 10).
# `time_utc` is converted from ET with the America/New_York time zone (EDT until 2026-11-01 and
# from 2027-03-14; EST in between and from 2027-11-07).
