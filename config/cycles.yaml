# Cycle anchors for the Cycles tab (Section 3.1). Each cycle runs bottom -> halving -> top and
# is named after the year of its top.
# Halvings are fixed protocol events (UTC dates). Bottoms and tops are search WINDOWS: the anchor
# is the lowest (highest) daily close inside the window, found from the data, and it only exists
# once the window has ended (no hindsight leak, D33). Verified against an independent source with
# `desk analytics verify-anchors` (Coin Metrics PriceUSD; Bitstamp for the 2013 cycle): D35.
# Extremes found in Stage 1.3 are noted after each window.
halvings:
  - 2012-11-28
  - 2016-07-09
  - 2020-05-11
  - 2024-04-20

cycles:
  BTC:
    - name: "2013"
      bottom_window: [2011-10-01, 2011-12-31] # 2011-11-18
      halving: 2012-11-28
      top_window: [2013-11-01, 2013-12-31] # 2013-12-04
    - name: "2017"
      bottom_window: [2014-12-01, 2015-02-28] # 2015-01-14
      halving: 2016-07-09
      top_window: [2017-12-01, 2017-12-31] # 2017-12-16
    - name: "2021"
      bottom_window: [2018-11-15, 2019-01-31] # 2018-12-15
      halving: 2020-05-11
      top_window: [2021-10-15, 2021-11-30] # 2021-11-08
    - name: "2025"
      bottom_window: [2022-11-01, 2022-12-31] # 2022-11-21
      halving: 2024-04-20
      top_window: [2025-09-01, 2025-12-31] # 2025-10-06, confirmed by Rob 2026-10-29
  # ETH has no halvings; BTC's halving dates are used for halving alignment.
  ETH:
    - name: "2017"
      bottom_window: null # Coinbase ETH data starts 2016-05-18
      halving: 2016-07-09
      top_window: [2018-01-01, 2018-01-31] # 2018-01-13
    - name: "2021"
      bottom_window: [2018-11-15, 2019-01-31] # 2018-12-14
      halving: 2020-05-11
      top_window: [2021-10-15, 2021-11-30] # 2021-11-08
    - name: "2025"
      bottom_window: [2022-06-01, 2022-12-31] # 2022-06-18
      halving: 2024-04-20
      top_window: [2025-08-01, 2025-12-31] # 2025-08-22

# Default anchor mode for the Cycles tab: halving | bottom | top
default_anchor: halving
