# LLM models (Decision 10, updated by D24 and D25). Ids and prices verified 2026-10-28 in
# Stage 0.3 and recorded in docs/DATA_SOURCES.md. Prices are USD per million tokens.
server:
  agent: claude-haiku-5-5 # agents, chat and the desk nodes (D24)
  brief_writer: claude-sonnet-5-5 # weekly brief
  brief_writer_degraded: claude-haiku-5-5 # Decision 9, step 3
  chat_degraded: claude-haiku-5-5 # Decision 9, step 1: same model at effort "low", fewer tokens
  video_summary: # tried in order, each with backoff retries; then title+description (D25)
    - gemini-3.5-flash-lite
    - gemini-3.8-flash

# Defaults offered to friends who bring their own key (cheap first).
byo_defaults:
  openrouter: anthropic/claude-haiku-5.5
  anthropic: claude-haiku-5-5
  openai: gpt-6-luna # cheapest current OpenAI model with tool calling (Stage 5.1, D45)

# The model picker in Settings (Stage 3.4). Cheap first; anyone can also type another id their
# key allows. OpenRouter ids and prices from GET https://openrouter.ai/api/v1/models (Stage 0.3).
byo_choices:
  openrouter:
    - anthropic/claude-haiku-5.5
    - openai/gpt-5-nano
    - openai/gpt-5-mini
    - google/gemini-3.5-flash-lite
  anthropic:
    - claude-haiku-5-5
    - claude-sonnet-5-5
  openai: # https://developers.openai.com/api/docs/pricing and /models (checked 2026-11-03)
    - gpt-6-luna
    - gpt-5.6-luna
    - gpt-5-mini

# Extra request parameters per model id (Stage 5.1). On Chat Completions gpt-6-luna supports
# function calling only with reasoning_effort none (its model page, checked 2026-11-03);
# langchain-openai 1.7.3 sends gpt-6 requests with tools to the Responses API, where none is
# also valid and keeps answers fast. OpenRouter always uses Chat Completions (D45).
byo_params:
  openai:
    gpt-6-luna: { reasoning_effort: none }
    gpt-5.6-luna: { reasoning_effort: low }

prices: # input, output per MTok; Anthropic https://platform.claude.com/docs/en/about-claude/pricing
  claude-haiku-5-5: # prompts <= 100K input tokens; the long-prompt rate above that
    { input: 0.10, output: 0.50, long_above: 100000, long_input: 0.50, long_output: 2.50 }
  claude-haiku-4-5: { input: 1.00, output: 5.00 }
  claude-sonnet-5-5: { input: 2.00, output: 10.00 }
  # Gemini runs on the free tier ($0). Paid-tier prices, for the D9 cap if that changes:
  gemini-3.5-flash-lite: { input: 0.30, output: 2.50 }
  gemini-3.8-flash: { input: 0.75, output: 3.75 } # until 2026-12-31; then 1.50 / 7.50
