# App-wide settings. Secrets never go here (use .env / GitHub secrets / Secret Manager).

features: # Decision 1: switch features off per deployment
  mco: true # also MCO_ENABLED env var; off if the app ever goes public without permission
  mco_tab: true # v1.2: the MCO tab itself (Stage 6.2; needs mco on too); `mco` alone governs the data
  agent: true # v1.1: the Agent tab (Stage 5.2)
  signals: false # v1.3
  onchain_macro: true # v1.1 (tab built in Stage 4.1)

budget: # Decision 9. The cap itself is enforced in backend/src/desk/agents/cost.py
  server_llm_cap_usd_per_month: 8.0
  degrade_order: [chat_model, mco_low_priority, brief_writer_haiku]
  degrade_at_fraction: 0.8 # step 1 starts at 80% of the cap

api: # Stage 2.1 (D37). In memory, per Cloud Run instance
  rate_limit_per_minute: 120

agent: # Section 3.2
  max_tool_calls: 10
  timeout_seconds: 90
  messages_per_user_per_hour: 30 # counted in the database, so it holds across instances
  history_messages: 20 # earlier user/assistant messages sent with each question
  max_message_chars: 4000
  max_output_tokens: 4000 # Haiku 5.5's adaptive thinking counts here; 2000 cut answers off
  degraded_max_output_tokens: 1500

desk: # Section 3.3, the multi-agent desk (Stage 5.3, D47)
  timeout_seconds: 180 # a whole run
  analyst_timeout_seconds: 60 # each analyst; a late analyst is marked unavailable
  node_timeout_seconds: 30 # each debate turn and the head
  analyst_max_tool_calls: 6
  runs_per_user_per_hour: 5 # "Ask the desk" runs, on top of the chat limit
  max_reference_distance: 0.5 # validator: levels within +-50% of the last close
  groups: # desk-mcp tool groups per analyst
    technical: market,cycles,stats
    context: context,views
  estimate_tokens: # per node, input and output: the live SOL run on Haiku 5.5, 2026-11-03 (D47)
    technical: [17700, 1100]
    context: [13600, 1300]
    bull_open: [2750, 410]
    bear_open: [2750, 410]
    bull_rebut: [3550, 450]
    bear_rebut: [3550, 450]
    head: [5100, 420]

mco: # Section 3.4, the private MCO pipeline (Stage 6.1, D48). Channel and keywords: feeds.yaml
  backfill_days: 3 # on discovery, older unseen videos are stored as `skip`, never summarized
  min_duration_seconds: 180 # shorter uploads are Shorts (YouTube allows up to 3 minutes)
  degraded_max_videos: 2 # Decision 9, step 2: near the cap, fewer videos and core coins only
  gemini_timeout_seconds: 300 # 3.8 Flash took 299 s in the Stage 0.3 probe (D25)
  gemini_attempts: 3 # per model, with exponential backoff on 408/429/5xx
  snap: # pivot_labels -> zigzag pivots of the same kind
    1d: { bars: 5, pct: 0.03 }
    1w: { bars: 2, pct: 0.06 }

signals: # Decision 8 and Section 3.5
  version: v1
  horizon_days: 7
  confidence_min: 0.5
  confidence_max: 0.95
  max_watchlist_coins_in_desk: 3
  paper_cost_per_side: 0.002
  trend: # Stage 7.1 (D51): P(higher close) 0.6 when long, 0.4 when flat
    sma_weeks: 20
    long_confidence: 0.6
    flat_confidence: 0.6 # stored as the confidence that flat is right (1 - 0.4)
  mco_max_age_days: 14 # an older MCO view gives no MCO signal for the coin
  mco_confidence: { high: 0.7, medium: 0.6, low: 0.55 } # from the extraction's confidence
  mco_default_confidence: 0.6

brief: # the weekly brief writer (Stage 7.1, D51); model in models.yaml `server.brief_writer`
  max_output_tokens: 16000 # adaptive thinking counts here: 5,626 for 3 coins (2026-11-04)
  timeout_seconds: 180
  estimate_tokens: # input, output: a fixed part plus each coin; the 3-coin dry run 2026-11-04
    base: [1800, 300] # gave 15,029 in and 5,626 out ($0.086 on Sonnet 5.5)
    per_coin: [4400, 1800]

app:
  url: https://crypto-desk-a9f.pages.dev # links in alerts

alerts: # Decision 11: which channels get each event
  brief_ready: [telegram, discord]
  level_cross: [telegram, discord]
  new_mco_summary: [telegram, discord]
  mco_review_pending: [telegram]
  ops_failure: [telegram, discord_ops] # admin channels only
