# Local Postgres for development and tests (production uses Neon).
# Start: docker compose up -d db
# Then set in .env: DATABASE_URL=postgresql://desk:desk@localhost:5432/desk
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: desk
      POSTGRES_PASSWORD: desk # local only, not a secret
      POSTGRES_DB: desk
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U desk -d desk"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
