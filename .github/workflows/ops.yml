name: Ops

# Stage 8.1 (D53): every Monday at 07:00 UTC, after the weekly signals (00:15) and MCO (06:30)
# jobs. First an encrypted backup of the non-reproducible tables to the private GCS bucket, then
# the weekly ops summary to the admin Telegram (which shows the backup's outcome).
#
# The dump holds MCO-derived rows (Decision 6): it is never uploaded as an artifact or printed.
# The log carries file names, sizes and counts only. Error text travels through files and env
# vars, never `${{ }}` inside `run:`.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      backup:
        description: "Run the backup"
        type: boolean
        default: true
      send_summary:
        description: "Send the ops summary to Telegram"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ops
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  backup:
    if: github.event_name == 'schedule' || inputs.backup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Workload Identity Federation (upload only: roles/storage.objectCreator)
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_OPS_WEBHOOK_URL: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 (no floating major tag)
        with:
          version: "0.11.7"
          python-version: "3.12"
          working-directory: backend
          enable-cache: true
      - run: uv sync --locked
      - name: Install the Postgres 18 client (Neon runs 18; pg_dump must not be older)
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-18
          pg_dump --version
      - id: auth
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/850576035365/locations/global/workloadIdentityPools/github/providers/crypto-desk
          service_account: desk-deployer@crypto-desk-513023.iam.gserviceaccount.com
          token_format: access_token
      - name: Backup
        env:
          GCS_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        run: >-
          uv run desk ops backup --workdir "$RUNNER_TEMP/backup"
          --summary-file "$RUNNER_TEMP/backup_summary.txt"
      - name: Alert admins on failure
        if: failure()
        run: >-
          uv run desk notify send ops_failure --title "Backup failed"
          --body-file "$RUNNER_TEMP/backup_summary.txt" --url "$RUN_URL"

  summary:
    needs: backup
    # After the backup whatever its outcome, so the summary can report a failed one; also when
    # the backup was switched off by hand.
    if: always() && (github.event_name == 'schedule' || inputs.send_summary)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DISCORD_OPS_WEBHOOK_URL: ${{ secrets.DISCORD_OPS_WEBHOOK_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3 (no floating major tag)
        with:
          version: "0.11.7"
          python-version: "3.12"
          working-directory: backend
          enable-cache: true
      - run: uv sync --locked
      - name: Weekly ops summary
        run: uv run desk ops summary
      - name: Alert admins on failure
        if: failure()
        run: >-
          uv run desk notify send ops_failure --title "Ops summary failed"
          --body "The weekly ops summary could not be built or sent; see the run log."
          --url "$RUN_URL"
